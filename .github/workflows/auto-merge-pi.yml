name: Auto-merge pi bumps

# Dependabot's weekly @earendil-works/* group PR merges itself once the required
# checks (CI: verify, e2e) are green. Major bumps arrive as separate PRs and are
# left for a human. Needs "Allow auto-merge" on and `verify`/`e2e` required on main.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      contains(github.event.pull_request.title, 'earendil-pi group')
    steps:
      - name: Only dependency files changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          unexpected=$(gh pr diff "$PR_URL" --name-only \
            | grep -Ev '^(pnpm-lock\.yaml|pnpm-workspace\.yaml|packages/[^/]+/package\.json)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Refusing to auto-merge, unexpected files:"
            echo "$unexpected"
            exit 1
          fi
      - name: Merge when checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
