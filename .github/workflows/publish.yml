name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm check
      - run: mise exec -- pnpm test
      - run: mise exec -- pnpm build
      - run: mise exec -- pnpm smoke:install
      - run: mise exec -- npm install --global npm@11
      - run: mise exec -- npm publish --provenance --access public
        working-directory: packages/cli
