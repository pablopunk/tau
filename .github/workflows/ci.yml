name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm check
      - run: mise exec -- pnpm test
      - run: mise exec -- pnpm build
      - run: mise exec -- pnpm smoke:binary
      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: |
            packages/cli/dist
            packages/web/dist
          retention-days: 1

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: mise exec -- pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: packages
      - run: mise exec -- pnpm --filter @tau/e2e exec playwright install --with-deps chromium
      - run: mise exec -- pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: test-artifacts
          retention-days: 7
