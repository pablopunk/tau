name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm check
      - run: mise exec -- pnpm test
      - run: mise exec -- pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: packages/cli/dist
          retention-days: 1

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise exec -- pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: packages/cli/dist
      - run: mise exec -- pnpm --filter @pi-everywhere/e2e exec playwright install --with-deps chromium
      - run: mise exec -- pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: test-artifacts
          retention-days: 7
